services:
  inventoryservice:
    cpus: ${BENCHMARK_SERVICE_CORES}
    environment:
      SERVICELIB_NOOP_LOGS: "1"
      SERVICELIB_NOOP_METRICS: "1"
      SERVICELIB_NOOP_TRACING: "1"
      DEFAULT_POOL_EXECUTORS_COUNT: ${BENCHMARK_SERVICE_CORES}
      INVENTORY_PRIORITY_WORKERS_EXECUTORS_COUNT: ${BENCHMARK_SERVICE_CORES}
    ports: !override
      - "9092:9092"
    restart: "no"

  orderservice:
    cpus: ${BENCHMARK_SERVICE_CORES}
    environment:
      SERVICELIB_NOOP_LOGS: "1"
      SERVICELIB_NOOP_METRICS: "1"
      SERVICELIB_NOOP_TRACING: "1"
      DEFAULT_POOL_EXECUTORS_COUNT: ${BENCHMARK_SERVICE_CORES}
      INVENTORY_PRIORITY_WORKERS_EXECUTORS_COUNT: ${BENCHMARK_SERVICE_CORES}
      INVENTORY_SERVICE_API_CONNECTIONS_COUNT: ${BENCHMARK_GRPC_CONNECTIONS}
    ports: !override
      - "9091:9091"
    restart: "no"

  loadgen:
    image: ${DEPENDENCY_DOCKER_REGISTRY:-docker.io}/grafana/k6:0.55.2
    cpus: ${BENCHMARK_LOADGEN_CORES}
    user: "0:0"
    profiles: [benchmark]
    environment:
      BENCHMARK_DURATION: ${BENCHMARK_DURATION}
      BENCHMARK_DURATION_SECONDS: ${BENCHMARK_DURATION_SECONDS}
      BENCHMARK_MAX_VUS: ${BENCHMARK_MAX_VUS:-4096}
      BENCHMARK_METHOD: ${BENCHMARK_METHOD:-POST}
      BENCHMARK_MODE: ${BENCHMARK_MODE:-closed}
      BENCHMARK_PAYLOAD_MODE: ${BENCHMARK_PAYLOAD_MODE:-normal}
      BENCHMARK_PRE_ALLOCATED_VUS: ${BENCHMARK_PRE_ALLOCATED_VUS:-128}
      BENCHMARK_RATE: ${BENCHMARK_RATE:-0}
      BENCHMARK_RESULT_FILE: ${BENCHMARK_RESULT_FILE}
      BENCHMARK_SCENARIO: ${BENCHMARK_SCENARIO:-process_order_out_of_stock}
      BENCHMARK_EXPECTED_STATUS: ${BENCHMARK_EXPECTED_STATUS:-200}
      BENCHMARK_TARGET: ${BENCHMARK_TARGET:-http://orderservice:9091/v1/processorder}
      BENCHMARK_VUS: ${BENCHMARK_VUS}
    volumes:
      - ${BENCHMARK_DIR}:/scripts:ro
      - ${BENCHMARK_RESULT_HOST_FILE}:/results/result.json
    networks:
      - app_net
    entrypoint: [k6]
    command: [run, --quiet, "${BENCHMARK_LOAD_SCRIPT}"]
