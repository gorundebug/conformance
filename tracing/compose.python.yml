services:
  analyticsservice:
    command:
      - --config
      - /workspace/config/config.yaml
      - --overrides
      - /workspace/conformance/analyticsservice.overrides.yaml
    volumes:
      - ${SERVICELIB_CONFORMANCE_DIR}/.artifacts/tracing/python:/workspace/conformance:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      - otel-collector

  inventoryservice:
    command:
      - --config
      - /workspace/config/config.yaml
      - --overrides
      - /workspace/conformance/inventoryservice.overrides.yaml
    volumes:
      - ${SERVICELIB_CONFORMANCE_DIR}/.artifacts/tracing/python:/workspace/conformance:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      - otel-collector

  orderservice:
    command:
      - --config
      - /workspace/config/config.yaml
      - --overrides
      - /workspace/conformance/orderservice.overrides.yaml
    volumes:
      - ${SERVICELIB_CONFORMANCE_DIR}/.artifacts/tracing/python:/workspace/conformance:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      - inventoryservice
      - otel-collector

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks:
      - app_net
