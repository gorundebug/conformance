services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    networks: [app_net]

  analyticsservice:
    environment:
      ANALYTICS_SERVICE_ENVIRONMENT: production
      ORDER_EVENTS_BROKERS: redpanda:9092
      SERVICELIB_OTEL_ENABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RUST_LOG: info
    depends_on:
      - otel-collector

  inventoryservice:
    environment:
      SERVICELIB_OTEL_ENABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RUST_LOG: info
    depends_on:
      - otel-collector

  orderservice:
    environment:
      SERVICELIB_OTEL_ENABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RUST_LOG: info
      ORDER_PROCESSED_ENABLED: "true"
    depends_on:
      - otel-collector
      - inventoryservice
